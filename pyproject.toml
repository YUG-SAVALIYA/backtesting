[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi-supertrend-backtester"
version = "0.1.0"
description = "IDE-friendly RSI and Supertrend trading signal generator and backtester"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "ta-lib>=0.4.0",
  "fastapi>=0.111.0",
  "uvicorn>=0.30.1",
  "httpx>=0.28.0",
  "python-dotenv>=1.0.1",
  "pydantic-settings>=2.6.1",
  "tenacity>=9.0.0",
  "aiofiles>=24.1.0"
]

[project.scripts]
trade-backtest = "rsi_supertrend_backtester.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
