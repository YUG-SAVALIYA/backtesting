<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSI Supertrend — Trading Suite</title>
    <style>
        :root {
            --bg-color: #0d1117; --panel-bg: #161b22; --border: #30363d;
            --text-main: #c9d1d9; --text-muted: #8b949e;
            --primary: #2f81f7; --primary-hover: #1f6feb;
            --success: #2ea043; --danger: #da3633;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: var(--bg-color); color: var(--text-main);
            margin: 0; padding: 2rem; min-height: 100vh;
        }
        .nav-container {
            max-width: 1400px; margin: 0 auto 2rem auto;
            display: flex; gap: 1rem; align-items: center;
            padding-bottom: 1.5rem; border-bottom: 1px solid var(--border);
        }
        .nav-logo { font-size: 1.2rem; font-weight: 700; color: #fff; margin-right: 1rem; display: flex; align-items: center; gap: .5rem; }
        .nav-logo span { color: var(--primary); }
        .container { max-width: 1400px; margin: 0 auto; width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .panel { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
        .full-width { grid-column: 1 / -1; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; margin-bottom: .5rem; font-weight: 500; font-size: .9rem; }
        .form-control { width: 100%; background: #0d1117; border: 1px solid var(--border); color: var(--text-main); padding: .5rem .75rem; border-radius: 6px; font-size: .95rem; transition: border-color .2s; }
        .form-control:focus { outline: none; border-color: var(--primary); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        button { width: 100%; background: var(--success); color: #fff; border: none; padding: .75rem; font-size: 1rem; font-weight: 600; border-radius: 6px; cursor: pointer; transition: background-color .2s; margin-top: 1rem; }
        button:hover { background: #238636; }
        button:disabled { background: var(--border); cursor: not-allowed; color: var(--text-muted); }
        .toggle-btn { background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: .35rem .75rem; font-size: .8rem; margin: 0; width: auto; }
        .toggle-btn:hover { background: rgba(88,166,255,.1); }
        .results { margin-top: 2rem; display: none; }
        .metrics-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 1rem; margin-bottom: 2rem; }
        .metric-card { background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 1rem; text-align: center; }
        .metric-value { font-size: 1.5rem; font-weight: 700; color: var(--primary); margin-top: .5rem; }
        table { width: 100%; border-collapse: collapse; font-size: .9rem; }
        th, td { padding: .75rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { font-weight: 600; color: var(--text-muted); background: rgba(255,255,255,.02); }
        .status-win { color: var(--success); } .status-loss { color: var(--danger); } .status-expired { color: var(--text-muted); }
        .loader { display: none; border: 3px solid rgba(255,255,255,.1); border-radius: 50%; border-top: 3px solid var(--primary); width: 24px; height: 24px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slideUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:none; } }
        @keyframes pulse { 0%,100% { box-shadow:0 0 8px rgba(22,163,74,.5); } 50% { box-shadow:0 0 20px rgba(22,163,74,.9); } }
        @keyframes shimmer { 0% { background-position:0% 0%; } 100% { background-position:200% 0%; } }
        #liveScannerPanel { background: linear-gradient(135deg,rgba(22,27,34,.95),rgba(13,17,23,.98)); border: 1px solid rgba(47,129,247,.18); border-radius: 16px; padding: 1.75rem; box-shadow: 0 8px 32px rgba(0,0,0,.4); position: relative; overflow: hidden; }
        #liveScannerPanel::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,#2f81f7,#58a6ff,#ab71f8,#2f81f7); background-size:200% 100%; animation:shimmer 3s linear infinite; }
        .scanner-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; padding-bottom:1rem; border-bottom:1px solid rgba(255,255,255,.06); }
        .scanner-title { margin:0; font-size:1.15rem; font-weight:700; color:#fff; display:flex; align-items:center; gap:.6rem; }
        #btnRunScan { background:linear-gradient(135deg,#2f81f7,#1f6feb) !important; box-shadow:0 0 16px rgba(47,129,247,.4); border-radius:8px !important; font-weight:700 !important; padding:.55rem 1.6rem !important; }
        #liveScannerPanel input[type=number] { -moz-appearance:textfield; }
        #liveScannerPanel input::-webkit-outer-spin-button, #liveScannerPanel input::-webkit-inner-spin-button { -webkit-appearance:none; }
        .scan-config-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1rem; margin-bottom:1.25rem; }
        .scan-param { background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.07); border-radius:10px; padding:.85rem; }
        .scan-param label { display:block; font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.07em; margin-bottom:.55rem; }
        .scan-param .form-control { background:rgba(0,0,0,.3); border-color:rgba(255,255,255,.1); }
        .live-filter-bar { background:rgba(47,129,247,.06); border:1px solid rgba(47,129,247,.2); border-radius:10px; padding:.9rem 1.1rem; margin-bottom:1.25rem; }
        .scan-results-table th { background:rgba(255,255,255,.025); font-size:.73rem; font-weight:600; text-transform:uppercase; padding:.75rem .9rem; color:var(--text-muted); white-space:nowrap; border-bottom:1px solid rgba(255,255,255,.08); }
        .scan-results-table td { padding:.7rem .9rem; border-bottom:1px solid rgba(255,255,255,.05); }
        .scan-results-table tr:hover td { background:rgba(47,129,247,.05); }
        .badge-up { color:#2ea043; font-weight:700; font-size:.75rem; } .badge-down { color:#da3633; font-weight:700; font-size:.75rem; }
        .badge-above { background:rgba(46,160,67,.15); color:#2ea043; padding:.15rem .45rem; border-radius:20px; font-size:.72rem; font-weight:600; }
        .badge-below { background:rgba(218,54,51,.15); color:#da3633; padding:.15rem .45rem; border-radius:20px; font-size:.72rem; font-weight:600; }
        .detail-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:.75rem; padding:1.25rem; }
        .detail-card { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:10px; padding:.9rem 1rem; }
        .detail-card .dc-label { font-size:.7rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; }
        .detail-card .dc-value { font-size:1.1rem; font-weight:700; }
        #stockDetailModal::-webkit-scrollbar { width:5px; }
        #stockDetailModal::-webkit-scrollbar-thumb { background:rgba(255,255,255,.12); border-radius:4px; }
        .filter-group { display:flex; gap:.5rem; align-items:center; }
    </style>
</head>
<body>

<div class="nav-container">
    <div class="nav-logo">&#128200; RSI <span>Supertrend</span></div>
    <button id="navBacktest" class="toggle-btn" onclick="switchMainTab('backtest')"
        style="background-color:transparent;color:var(--text-main);border-color:var(--border);">
        &#128202; Backtester
    </button>
    <button id="navLiveTrading" class="toggle-btn" onclick="switchMainTab('live')"
        style="background-color:var(--primary);color:#fff;border-color:var(--primary);">
        &#128301; Live Trading
    </button>
</div>

<!-- BACKTESTER VIEW -->
<div class="container" id="backtestView" style="display:none;">
%%BACKTESTER%%
</div>

<!-- LIVE TRADING VIEW -->
<div class="container" id="liveView" style="display:grid;">
    <div class="full-width">
        <!-- DATA COLLECTION PANEL -->
        <div class="panel full-width" style="margin-bottom:1.5rem;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;padding-bottom:.75rem;border-bottom:1px solid var(--border);">
                <h3 style="margin:0;font-size:1rem;">&#128225; Live Data Collection</h3>
                <span id="liveStatusBadge" style="font-size:.75rem;font-weight:700;padding:.25rem .75rem;border-radius:20px;background:rgba(139,148,158,.15);color:var(--text-muted);">IDLE</span>
            </div>
            <div style="display:flex;gap:1rem;align-items:flex-end;flex-wrap:wrap;">
                <div class="form-group" style="margin:0;flex:1;min-width:200px;">
                    <label>Company Universe</label>
                    <select id="liveCompanySelect" class="form-control">
                        <option value="ALL">All (Nifty 500)</option>
                        <option value="NIFTY50">Nifty 50</option>
                        <option value="NIFTY100">Nifty 100</option>
                        <option value="NIFTY200">Nifty 200</option>
                    </select>
                </div>
                <button id="startLiveBtn" onclick="startLiveTrading()" style="margin:0;width:auto;padding:.65rem 2rem;background:var(--primary);display:flex;align-items:center;gap:.6rem;">
                    <span id="startLiveText">&#9654; Start Live Trading</span>
                    <div id="liveLoader" class="loader" style="width:16px;height:16px;border-width:2px;display:none;"></div>
                </button>
            </div>
            <div id="overallProgressWrapper" style="display:none;margin-top:1.25rem;">
                <div style="display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:.75rem;">
                    <div class="metric-card" style="flex:1;min-width:110px;padding:.65rem;text-align:center;">
                        <div style="font-size:.72rem;color:var(--text-muted);">Progress</div>
                        <div class="metric-value" id="liveMetricProgress" style="font-size:1.1rem;">0/0</div>
                    </div>
                    <div class="metric-card" style="flex:1;min-width:110px;padding:.65rem;text-align:center;">
                        <div style="font-size:.72rem;color:var(--text-muted);">Success</div>
                        <div class="metric-value" id="liveMetricSuccess" style="font-size:1.1rem;color:var(--success);">0</div>
                    </div>
                    <div class="metric-card" style="flex:1;min-width:110px;padding:.65rem;text-align:center;">
                        <div style="font-size:.72rem;color:var(--text-muted);">Failed</div>
                        <div class="metric-value" id="liveMetricFailed" style="font-size:1.1rem;color:var(--danger);">0</div>
                    </div>
                    <div class="metric-card" style="flex:1;min-width:110px;padding:.65rem;text-align:center;">
                        <div style="font-size:.72rem;color:var(--text-muted);">Requests</div>
                        <div class="metric-value" id="liveMetricRequests" style="font-size:1.1rem;">0</div>
                    </div>
                </div>
                <div style="background:rgba(0,0,0,.3);border-radius:6px;height:8px;overflow:hidden;margin-bottom:.4rem;">
                    <div id="liveProgressBar" style="height:100%;width:0%;background:linear-gradient(90deg,var(--primary),#58a6ff);transition:width .4s;"></div>
                </div>
                <div style="display:flex;justify-content:space-between;font-size:.72rem;color:var(--text-muted);">
                    <span id="liveProgressStatusNote">Processing universe...</span>
                    <span id="liveProgressPercent">0%</span>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem;">
                    <div>
                        <div style="font-size:.72rem;font-weight:700;color:var(--text-muted);margin-bottom:.35rem;">PROCESSING</div>
                        <div id="liveActiveList" style="background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:6px;max-height:180px;overflow-y:auto;">
                            <div style="padding:1rem;text-align:center;color:var(--text-muted);font-size:.82rem;">Not started</div>
                        </div>
                    </div>
                    <div>
                        <div style="font-size:.72rem;font-weight:700;color:var(--danger);margin-bottom:.35rem;">ERRORS</div>
                        <div id="liveErrorList" style="background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:6px;max-height:180px;overflow-y:auto;">
                            <div style="padding:1rem;text-align:center;color:var(--text-muted);font-size:.82rem;">No errors</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- SCANNER SECTION -->
%%SCANNER%%
    </div>
</div>

%%MODAL%%

<script>
%%MAINJS%%
</script>

<script>
function switchMainTab(tab) {
    document.getElementById('backtestView').style.display = tab === 'backtest' ? 'grid' : 'none';
    document.getElementById('liveView').style.display     = tab === 'live'     ? 'grid' : 'none';
    document.getElementById('navBacktest').style.backgroundColor    = tab === 'backtest' ? 'var(--primary)' : 'transparent';
    document.getElementById('navBacktest').style.color              = tab === 'backtest' ? '#fff'           : 'var(--text-main)';
    document.getElementById('navBacktest').style.borderColor        = tab === 'backtest' ? 'var(--primary)' : 'var(--border)';
    document.getElementById('navLiveTrading').style.backgroundColor = tab === 'live'     ? 'var(--primary)' : 'transparent';
    document.getElementById('navLiveTrading').style.color           = tab === 'live'     ? '#fff'           : 'var(--text-main)';
    document.getElementById('navLiveTrading').style.borderColor     = tab === 'live'     ? 'var(--primary)' : 'var(--border)';
}
switchMainTab('live');
</script>

</body>
</html>
